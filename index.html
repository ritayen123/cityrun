<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe4f4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
<title>SLED RUN 企鵝雪橇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: ui-rounded, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #cfe4f4;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* HUD */
  #hud { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding-top: 18px;
    text-align: center; opacity: 0; transition: opacity .4s; }
  #dist { font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 rgba(122,156,196,.55), 0 6px 18px rgba(90,130,175,.35); letter-spacing: 1px; }

  #toast { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 34px;
    font-weight: 900; color: #ffd98a; text-shadow: 0 2px 0 #e8862e, 0 6px 16px rgba(200,110,30,.4);
    opacity: 0; }
  #toast.show { animation: toastPop 1.1s ease-out; }
  @keyframes toastPop { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.12); }
    35% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }

  #muteBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px;
    width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.75);
    font-size: 20px; pointer-events: auto; cursor: pointer; box-shadow: 0 3px 10px rgba(90,130,175,.25); }

  /* 起始畫面 */
  #startScreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 16vh; transition: opacity .45s; }
  #title { font-size: min(15vw, 72px); font-weight: 900; color: #fff; letter-spacing: 2px;
    text-shadow: 0 3px 0 #a8c4e0, 0 10px 26px rgba(90,130,175,.4); }
  #subtitle { margin-top: 6px; font-size: 15px; font-weight: 700; color: #7d9cbd; letter-spacing: 6px; }
  #tapHint { position: absolute; bottom: 18vh; font-size: 18px; font-weight: 700; color: #6f92b5;
    animation: pulse 1.4s ease-in-out infinite; }
  #bestLine { position: absolute; bottom: 13vh; font-size: 14px; font-weight: 600; color: #93aecb; }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }

  /* 結算 */
  #overScreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(240,246,252,.35); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #overScreen.show { opacity: 1; pointer-events: auto; }
  #overTitle { font-size: 46px; font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 #a8c4e0, 0 8px 22px rgba(90,130,175,.4); letter-spacing: 3px; }
  #newBest { margin-top: 6px; font-size: 15px; font-weight: 800; color: #e8a13c; letter-spacing: 2px;
    visibility: hidden; }
  #overCard { margin-top: 22px; background: rgba(255,255,255,.88); border-radius: 22px; padding: 22px 40px;
    box-shadow: 0 10px 30px rgba(90,130,175,.25); text-align: center; }
  .statRow { display: flex; justify-content: space-between; gap: 44px; font-size: 17px; margin: 8px 0; }
  .statRow .k { color: #8ba3bd; font-weight: 600; }
  .statRow .v { color: #4d6a82; font-weight: 800; }
  #retryBtn { margin-top: 26px; padding: 15px 52px; font-size: 19px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #ffb35c, #f28c2e); border: none; border-radius: 30px;
    box-shadow: 0 6px 18px rgba(242,140,46,.45); cursor: pointer; font-family: inherit; }
  #retryBtn:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="ui">
  <div id="hud"><div id="dist">0m</div></div>
  <div id="toast"></div>
  <button id="muteBtn">🔊</button>
  <div id="startScreen">
    <div id="title">SLED RUN</div>
    <div id="subtitle">企鵝雪橇</div>
    <div id="tapHint">點擊開始滑行</div>
    <div id="bestLine"></div>
  </div>
  <div id="overScreen">
    <div id="overTitle">哎呀！</div>
    <div id="newBest">★ 新紀錄 ★</div>
    <div id="overCard">
      <div class="statRow"><span class="k">距離</span><span class="v" id="ovDist">0m</span></div>
      <div class="statRow"><span class="k">最佳</span><span class="v" id="ovBest">0m</span></div>
    </div>
    <button id="retryBtn">再滑一次</button>
  </div>
</div>
<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
'use strict';
/* ============ SLED RUN 企鵝雪橇 ============
   自由轉向下坡雪橇跑酷（複刻 sled.surfers 風格）
   雪山關與雪城市關每 420m 交替出現           */

// ---------- 基本常數 ----------
const TRACK_HALF = 10.8;        // 可滑行半寬
const SPAWN_Z = -170;           // 生成距離
const KILL_Z = 22;              // 回收距離
const THEME_LEN = 420;          // 每個主題長度（公尺）
const GRAV = 22;
const BEST_KEY = 'cityrun_sled_best';

// ---------- 地形起伏（s = 滑道座標，公尺；正弦疊加出連綿上下坡） ----------
function terrainH(s) {
  const e = Math.min(1, Math.max(0, s / 120));  // 開頭 120m 漸入
  return e * (4.2 * Math.sin(s * .024) + 2.6 * Math.sin(s * .010 + 2));
}
function terrainSlope(s) {
  const e = Math.min(1, Math.max(0, s / 120));
  return e * (4.2 * .024 * Math.cos(s * .024) + 2.6 * .010 * Math.cos(s * .010 + 2));
}

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe9f5, 60, 250);

// 天空漸層
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#a9cdea'); gr.addColorStop(.55, '#cbe1f2'); gr.addColorStop(1, '#eef5fb');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 400);

scene.add(new THREE.HemisphereLight(0xcfe2f5, 0xffffff, .95));
const sun = new THREE.DirectionalLight(0xfff4e0, .85);
sun.position.set(-30, 60, -20);
scene.add(sun);

// ---------- 材質工具 ----------
const MAT = {};
function mat(color, opt) {
  const key = color + JSON.stringify(opt || {});
  if (!MAT[key]) MAT[key] = new THREE.MeshLambertMaterial(Object.assign({ color }, opt));
  return MAT[key];
}
function mesh(geo, m, x, y, z, parent) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  (parent || scene).add(o);
  return o;
}

// ---------- 雪地（兩塊接力） ----------
const snowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f8fd'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 26; i++) {  // 大片淡藍雪影
    g.fillStyle = 'rgba(196,215,238,.16)';
    g.beginPath();
    g.ellipse(Math.random() * 256, Math.random() * 256, 24 + Math.random() * 44, 14 + Math.random() * 26, Math.random() * 3, 0, 7);
    g.fill();
  }
  for (let i = 0; i < 420; i++) {
    g.fillStyle = Math.random() < .5 ? 'rgba(190,210,235,.14)' : 'rgba(255,255,255,.3)';
    const r = Math.random() * 1.6 + .4;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 50; i++) {  // 亮晶晶
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.fillRect(Math.random() * 256, Math.random() * 256, 1.4, 1.4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 12); t.encoding = THREE.sRGBEncoding;
  return t;
})();
const GROUND_LEN = 240;
const grounds = [0, 1].map(i => {
  const p = mesh(new THREE.PlaneGeometry(140, GROUND_LEN, 1, 80),
    new THREE.MeshLambertMaterial({ color: 0xf5f9fd, map: snowTex }), 0, 0, -i * GROUND_LEN);
  p.rotation.x = -Math.PI / 2;
  return p;
});
// 依滑道座標把地面頂點抬成坡面（換段接力時重算一次即可）
function computeGround(p) {
  const pos = p.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const s = dist - p.position.z + pos.getY(i);  // 該頂點的滑道座標
    pos.setZ(i, terrainH(s));
  }
  pos.needsUpdate = true;
  p.geometry.computeVertexNormals();
}

// ---------- 遠景：雪山 & 城市 ----------
function setOpacity(group, v) {
  if (Math.abs((group.userData.op ?? -1) - v) < .01) return;  // 沒變就不重走整棵樹
  group.userData.op = v;
  group.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = v; } });
  group.visible = v > .02;
}
const mountainBack = new THREE.Group();
{
  const ridge = [[-75, 26, -182], [-38, 38, -192], [0, 30, -196], [42, 42, -188], [80, 27, -180]];
  ridge.forEach(([x, h, z]) => {
    const m = mesh(new THREE.ConeGeometry(h * 1.15, h, 5),
      new THREE.MeshLambertMaterial({ color: 0x93a5bd, flatShading: true }), x, h / 2 - 2, z, mountainBack);
    const cap = mesh(new THREE.ConeGeometry(h * .5, h * .42, 5),
      new THREE.MeshLambertMaterial({ color: 0xf0f5fb, flatShading: true }), x, h - h * .21 - 2, z, mountainBack);
    cap.rotation.y = m.rotation.y = Math.random() * Math.PI;
  });
}
scene.add(mountainBack);

const cityBack = new THREE.Group();
{
  // 巴黎鐵塔（簡化格架）
  const tm = new THREE.MeshLambertMaterial({ color: 0x77695f, flatShading: true });
  const tower = new THREE.Group();
  [[38, 3.2, 0], [26, 2.2, 22], [16, 1.5, 42], [10, 1, 58]].forEach(([h, r, y]) => {
    mesh(new THREE.CylinderGeometry(r, r * 2.4, h, 4), tm, 0, y + h / 2, 0, tower);
  });
  [[14, 20], [8, 40]].forEach(([w, y]) => mesh(new THREE.BoxGeometry(w, 1.6, w / 2.4), tm, 0, y, 0, tower));
  mesh(new THREE.ConeGeometry(.8, 6, 4), tm, 0, 66, 0, tower);
  tower.position.set(0, -2, -192); tower.scale.set(1.25, 1.25, 1.25);
  cityBack.add(tower);
  // 遠景樓房剪影
  for (let i = 0; i < 14; i++) {
    const h = 12 + Math.random() * 22, w = 10 + Math.random() * 12;
    const x = (i - 6.5) * 16 + (Math.random() * 6 - 3);
    if (Math.abs(x) < 16) continue;
    mesh(new THREE.BoxGeometry(w, h, 8),
      new THREE.MeshLambertMaterial({ color: [0x8d94a3, 0x9c8f8a, 0x7f8a99][i % 3], flatShading: true }),
      x, h / 2 - 2, -176 - Math.random() * 14, cityBack);
  }
}
scene.add(cityBack);
setOpacity(cityBack, 0);

// ---------- 程序化小物件工廠 ----------
function makeSnowTree() {
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(.16, .22, 1, 6), mat(0xa97b4f, { flatShading: true }), 0, .5, 0, g);
  const n = 2 + (Math.random() * 2 | 0);
  for (let i = 0; i < n; i++) {
    const r = 1 - i * .24, y = 1.1 + i * .75;
    mesh(new THREE.IcosahedronGeometry(r, 0), mat(0xf6fafc, { flatShading: true }), 0, y, 0, g)
      .rotation.set(Math.random(), Math.random() * 3, 0);
    mesh(new THREE.IcosahedronGeometry(r * .88, 0), mat(0x93c884, { flatShading: true }), .18, y - .32, .14, g)
      .rotation.set(Math.random() * 3, Math.random(), 0);
  }
  const s = .9 + Math.random() * .5;
  g.scale.setScalar(s);
  g.userData.r = s;
  return g;
}
function makeRock() {
  const g = new THREE.Group();
  const m = mesh(new THREE.DodecahedronGeometry(1, 0), mat(0x8d8477, { flatShading: true }), 0, .55, 0, g);
  m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  m.scale.set(1, .72, .9);
  mesh(new THREE.DodecahedronGeometry(.62, 0), mat(0xf2f7fc, { flatShading: true }), .08, 1, .04, g).scale.set(1, .5, .95);
  const s = .8 + Math.random() * .6;
  g.scale.setScalar(s);
  g.userData.r = 1.15 * s;
  return g;
}
function makeRamp() {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(3.4, 1.35); shape.lineTo(3.4, 0); shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 3.4, bevelEnabled: false });
  geo.rotateY(Math.PI / 2);          // 斜面朝向玩家來向（+z 低、-z 高）
  geo.translate(-1.7, 0, 1.7);
  mesh(geo, mat(0xe8a13c, { flatShading: true }), 0, 0, 0, g);
  // 板面橫條（貼齊斜面）＋頂端起跳緣
  const slopeA = Math.atan2(1.35, 3.4);
  [.26, .52, .78].forEach(t => {
    mesh(new THREE.BoxGeometry(3, .08, .52), mat(0xf7c66b), 0, 1.35 * t + .04, 1.7 - 3.4 * t, g)
      .rotation.x = slopeA;
  });
  mesh(new THREE.BoxGeometry(3.4, .3, .24), mat(0xc9812f, { flatShading: true }), 0, 1.42, -1.62, g);
  g.userData.r = 1.8; g.userData.ramp = true;
  return g;
}
function makeBorderPost() {
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(.13, .16, 2.6, 6), mat(0x8a6742, { flatShading: true }), 0, 1.3, 0, g);
  mesh(new THREE.SphereGeometry(.22, 6, 5), mat(0xffe9b8), 0, 2.7, 0, g);  // 燈
  g.userData.decor = true;
  return g;
}
function makeCliff() {
  const g = new THREE.Group();
  const m = mesh(new THREE.DodecahedronGeometry(3.2, 0), mat(0x6e6558, { flatShading: true }), 0, 2, 0, g);
  m.scale.set(1, 1.6, 1.1); m.rotation.y = Math.random() * 3;
  mesh(new THREE.DodecahedronGeometry(2, 0), mat(0xeef4fa, { flatShading: true }), .2, 4.4, 0, g).scale.set(1, .55, 1);
  g.userData.decor = true;
  return g;
}
const winTexCache = {};
function windowTex(base) {
  if (winTexCache[base]) return winTexCache[base];
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 128, 256);
  g.fillStyle = 'rgba(40,50,70,.75)';
  for (let y = 18; y < 240; y += 34)
    for (let x = 14; x < 112; x += 30)
      if (Math.random() < .85) g.fillRect(x, y, 16, 20);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  return winTexCache[base] = t;
}
function makeBuilding() {
  const h = 9 + Math.random() * 9, w = 7 + Math.random() * 5, d = 8 + Math.random() * 6;
  const base = ['#b04a3e', '#8a8f99', '#5d6b83', '#a3785c'][Math.random() * 4 | 0];
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ map: windowTex(base) }), 0, h / 2, 0, g);
  mesh(new THREE.BoxGeometry(w + .4, .7, d + .4), mat(0xf0f5fb), 0, h + .3, 0, g);  // 雪頂
  g.userData.decor = true;
  return g;
}
function makeCrate() {
  const g = new THREE.Group();
  const m = mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), mat(0x7a838f, { flatShading: true }), 0, .75, 0, g);
  m.rotation.y = Math.random() * .8;
  mesh(new THREE.BoxGeometry(1.6, .28, 1.6), mat(0xf0f5fb), 0, 1.55, 0, g);
  g.userData.r = 1.15;
  return g;
}
function makeKiosk() {
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(1.7, 2.1, 1.4), mat(0xc7503f, { flatShading: true }), 0, 1.05, 0, g);
  mesh(new THREE.BoxGeometry(2, .3, 1.7), mat(0xf0f5fb), 0, 2.25, 0, g);
  mesh(new THREE.BoxGeometry(1.1, .5, .1), mat(0xffe9b8), 0, 1.3, .71, g);
  g.userData.r = 1.25;
  return g;
}
function makePole() {
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(.14, .17, 4.4, 6), mat(0x4d545e, { flatShading: true }), 0, 2.2, 0, g);
  g.userData.r = .55;
  return g;
}
const FLAG_COLORS = [0x8e5bd1, 0xd34a4a, 0x4ab8b0, 0xe3c04a];
function makeFlagLine() {
  const g = new THREE.Group();
  [-12.2, 12.2].forEach(x => mesh(new THREE.CylinderGeometry(.12, .14, 6, 6), mat(0x5a4a3c), x, 3, 0, g));
  mesh(new THREE.BoxGeometry(24.4, .05, .05), mat(0x3d3833), 0, 5.9, 0, g);
  const n = 3 + (Math.random() * 2 | 0);
  for (let i = 0; i < n; i++) {
    const x = -8 + i * (16 / Math.max(n - 1, 1)) + (Math.random() * 2 - 1);
    const f = mesh(new THREE.BoxGeometry(1.7, 2.4, .08),
      mat(FLAG_COLORS[(Math.random() * 4) | 0], { flatShading: true }), x, 4.6, 0, g);
    f.rotation.y = (Math.random() - .5) * .4;
  }
  g.userData.decor = true;
  return g;
}

// ---------- 企鵝＋雪橇 ----------
const player = new THREE.Group();
const sled = new THREE.Group();
{
  mesh(new THREE.CylinderGeometry(.78, .85, .16, 18), mat(0x3f76d8), 0, .1, 0, sled).scale.set(.82, 1, 1.12);
  mesh(new THREE.CylinderGeometry(.62, .66, .06, 18), mat(0x5b8de4), 0, .2, 0, sled).scale.set(.82, 1, 1.12);
}
player.add(sled);
const penguin = new THREE.Group();
{
  mesh(new THREE.SphereGeometry(.5, 14, 12), mat(0x23262b), 0, .62, 0, penguin).scale.set(1, 1.15, 1.02);
  mesh(new THREE.SphereGeometry(.42, 12, 10), mat(0xf7fafc), 0, .56, .13, penguin).scale.set(.72, .92, .62);
  mesh(new THREE.ConeGeometry(.09, .2, 8), mat(0xf2a03d), 0, .78, .47, penguin).rotation.x = Math.PI / 2;
  [-1, 1].forEach(s => {
    mesh(new THREE.SphereGeometry(.05, 8, 6), mat(0xffffff), s * .14, .88, .4, penguin);
    const fl = mesh(new THREE.SphereGeometry(.2, 8, 6), mat(0x23262b), s * .48, .58, 0, penguin);
    fl.scale.set(.42, 1, .78); fl.rotation.z = s * .5;
    mesh(new THREE.BoxGeometry(.2, .07, .34), mat(0xf2a03d), s * .2, .2, .32, penguin).rotation.y = s * .18;
  });
}
penguin.rotation.y = Math.PI;  // 背對鏡頭、面向前方（同範例視角）
player.add(penguin);
scene.add(player);
// 假陰影
const shadow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 8, 64, 64, 62);
  gr.addColorStop(0, 'rgba(96,124,158,.4)'); gr.addColorStop(1, 'rgba(96,124,158,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = .02; m.renderOrder = 2;
  scene.add(m);
  return m;
})();

// ---------- 雪痕（緞帶網格） ----------
const TRAIL_MAX = 130;
const trailPts = [];  // {x, z}
const trailGeo = new THREE.BufferGeometry();
const trailPos = new Float32Array(TRAIL_MAX * 2 * 3);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
const trailMesh = new THREE.Mesh(trailGeo,
  new THREE.MeshBasicMaterial({ color: 0x8fadd0, transparent: true, opacity: .6, depthWrite: false, side: THREE.DoubleSide }));
trailMesh.renderOrder = 1;
trailMesh.frustumCulled = false;
scene.add(trailMesh);

function rebuildTrail() {
  const n = trailPts.length;
  for (let i = 0; i < n; i++) {
    const p = trailPts[i];
    const q = trailPts[Math.min(i + 1, n - 1)], o = trailPts[Math.max(i - 1, 0)];
    let dx = q.x - o.x, dz = q.z - o.z;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    const w = .62 * (.35 + .65 * (i / Math.max(n, 1)));  // 越舊越窄
    const y = (p.y || .03) + i * .0004;
    trailPos[i * 6] = p.x - dz * w; trailPos[i * 6 + 1] = y; trailPos[i * 6 + 2] = p.z + dx * w;
    trailPos[i * 6 + 3] = p.x + dz * w; trailPos[i * 6 + 4] = y; trailPos[i * 6 + 5] = p.z - dx * w;
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  trailGeo.setIndex(idx);
  trailGeo.attributes.position.needsUpdate = true;
}

// ---------- 飄雪 ----------
const snowPts = (() => {
  const n = 160, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = Math.random() * 60 - 30;
    arr[i * 3 + 1] = Math.random() * 30;
    arr[i * 3 + 2] = Math.random() * 80 - 60;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffffff, size: .22, transparent: true, opacity: .8, sizeAttenuation: true }));
  p.frustumCulled = false;
  scene.add(p);
  return p;
})();

// ---------- 雪花噴濺粒子池 ----------
const puffs = [];
{
  const geo = new THREE.IcosahedronGeometry(.15, 0);
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
    m.visible = false;
    scene.add(m);
    puffs.push({ m, life: 0, vx: 0, vy: 0, vz: 0 });
  }
}
let puffIdx = 0;
function spawnPuff(x, y, z, vx, vy, vz, scale) {
  const p = puffs[puffIdx = (puffIdx + 1) % puffs.length];
  p.m.position.set(x, y, z);
  p.m.scale.setScalar(scale || 1);
  p.m.visible = true;
  p.life = 1;
  p.vx = vx; p.vy = vy; p.vz = vz;
}
function burstPuffs(x, y, z, n, power) {
  for (let i = 0; i < n; i++)
    spawnPuff(x + (Math.random() - .5), y + Math.random() * .5, z + (Math.random() - .5),
      (Math.random() - .5) * power, 2 + Math.random() * power, (Math.random() - .3) * power, .7 + Math.random() * .9);
}
function updatePuffs(dt, worldSpeed) {
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt * 1.8;
    if (p.life <= 0) { p.m.visible = false; continue; }
    p.vy -= 14 * dt;
    p.m.position.x += p.vx * dt;
    p.m.position.y += p.vy * dt;
    p.m.position.z += (p.vz + worldSpeed) * dt;
    p.m.material.opacity = p.life * .9;
    p.m.scale.multiplyScalar(1 - dt * .8);
  }
}

// ---------- 音效（WebAudio 程序化） ----------
const AudioSys = {
  ctx: null, muted: false, windGain: null, windFilter: null, carveGain: null,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const mk = (freq, gain, type) => {
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
      return [f, g];
    };
    [this.windFilter, this.windGain] = mk(320, 0);
    [, this.carveGain] = mk(900, 0, 'bandpass');
  },
  update(speed, vx) {
    if (!this.ctx || this.muted) return;
    this.windGain.gain.value = .015 + speed / 30 * .06;
    this.windFilter.frequency.value = 260 + speed * 14;
    this.carveGain.gain.value = Math.min(Math.abs(vx) / 18, 1) * .05;
  },
  blip(freq, dur, vol, type) {
    if (!this.ctx || this.muted) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  jump() { this.blip(420, .3, .12, 'triangle'); },
  crash() { this.blip(90, .5, .3, 'square'); this.blip(60, .6, .25, 'sine'); },
  setMuted(v) {
    this.muted = v;
    if (this.windGain) { this.windGain.gain.value = 0; this.carveGain.gain.value = 0; }
  }
};

// ---------- 遊戲狀態 ----------
const world = new THREE.Group();  // 所有會移動的物件
scene.add(world);
let obstacles = [];   // {g, r, ramp}
let state = 'title';  // title | run | crash | over
let dist = 0, speed = 0, px = 0, pvx = 0, py = 0, pvy = 0, grounded = true;
let targetX = 0, pointerActive = false;
let spawnAt = 30, decorAt = 10, flagAt = 120;
let crashT = 0;
let penguinFly = null;
let best = +(localStorage.getItem(BEST_KEY) || 0);
let speedTier = 0;
if (location.hash.startsWith('#d=')) {  // 測試用：指定起始距離
  dist = +location.hash.slice(3) || 0;
  speedTier = Math.floor(dist / 250);
}
const RAMP_BOOST = location.hash.includes('ramp');  // 測試用：狂出跳台

const $ = id => document.getElementById(id);
$('bestLine').textContent = best ? `最佳紀錄 ${best}m` : '';

function themeAt(d) { return Math.floor(d / THEME_LEN) % 2; }  // 0 雪山 1 城市

// ---------- 生成 ----------
function place(g, x, z) {
  g.position.set(x, terrainH(dist - z), z);  // 貼合坡面
  world.add(g);
  if (!g.userData.decor) obstacles.push({ g, r: g.userData.r || 1, ramp: !!g.userData.ramp });
}
function spawnStep() {
  const aheadTheme = themeAt(dist - SPAWN_Z);
  const gap = Math.max(11, 19 - dist * .01);  // 障礙間距隨距離縮短
  if (dist >= spawnAt) {
    spawnAt = dist + gap * (0.7 + Math.random() * .6);
    const x = (Math.random() * 2 - 1) * (TRACK_HALF - 1);
    const roll = Math.random();
    let g;
    if (roll < (RAMP_BOOST ? .6 : .13)) g = makeRamp();
    else if (aheadTheme === 0) g = roll < .6 ? makeSnowTree() : makeRock();
    else g = roll < .45 ? makeCrate() : roll < .7 ? makePole() : roll < .85 ? makeKiosk() : makeSnowTree();
    place(g, x, SPAWN_Z);
    // 偶爾一排雙障礙
    if (dist > 150 && Math.random() < .3) {
      const x2 = x > 0 ? x - (6 + Math.random() * 6) : x + (6 + Math.random() * 6);
      const g2 = aheadTheme === 0 ? (Math.random() < .6 ? makeSnowTree() : makeRock()) : makeCrate();
      place(g2, THREE.MathUtils.clamp(x2, -TRACK_HALF + 1, TRACK_HALF - 1), SPAWN_Z - 3);
    }
  }
  if (dist >= decorAt) {
    decorAt = dist + 13;
    [-1, 1].forEach(s => {
      if (aheadTheme === 0) {
        place(makeBorderPost(), s * (TRACK_HALF + 1.6), SPAWN_Z + Math.random() * 6);
        const r = Math.random();
        if (r < .5) place(makeSnowTree(), s * (TRACK_HALF + 4 + Math.random() * 6), SPAWN_Z);
        else if (r < .72) place(makeCliff(), s * (TRACK_HALF + 6 + Math.random() * 4), SPAWN_Z);
      } else {
        place(makeBuilding(), s * (TRACK_HALF + 6.5 + Math.random() * 2), SPAWN_Z);
      }
    });
  }
  if (aheadTheme === 1 && dist >= flagAt) {
    flagAt = dist + 40 + Math.random() * 25;
    place(makeFlagLine(), 0, SPAWN_Z);
  }
}
// 開場把整條雪道先鋪滿（障礙＋路旁裝飾），不然要等十幾秒才有東西滑到面前
function prefill() {
  for (let z = -46; z > SPAWN_Z; z -= 12 + Math.random() * 9) {  // -46 起：開場留約 3 秒淨空
    const roll = Math.random();
    const g = roll < .1 ? makeRamp() : roll < .65 ? makeSnowTree() : makeRock();
    place(g, (Math.random() * 2 - 1) * (TRACK_HALF - 1), z);
  }
  for (let z = -8; z > SPAWN_Z; z -= 13) {
    [-1, 1].forEach(s => {
      place(makeBorderPost(), s * (TRACK_HALF + 1.6), z + Math.random() * 4);
      const r = Math.random();
      if (r < .5) place(makeSnowTree(), s * (TRACK_HALF + 4 + Math.random() * 6), z);
      else if (r < .72) place(makeCliff(), s * (TRACK_HALF + 6 + Math.random() * 4), z);
    });
  }
}
grounds.forEach(computeGround);
prefill();
if (location.hash.includes('jump')) place(makeRamp(), 0, -60);  // 測試用：正前方跳台

// ---------- 輸入 ----------
function normX(clientX) { return (clientX / innerWidth) * 2 - 1; }
addEventListener('pointerdown', e => {
  if (state === 'title') return startGame();
  if (state === 'run') { pointerActive = true; targetX = normX(e.clientX) * TRACK_HALF; }
});
addEventListener('pointermove', e => {
  if (pointerActive && state === 'run') targetX = normX(e.clientX) * TRACK_HALF;
});
addEventListener('pointerup', () => pointerActive = false);
addEventListener('pointercancel', () => pointerActive = false);
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'title' && (e.key === ' ' || e.key === 'Enter')) startGame();
});
addEventListener('keyup', e => keys[e.key] = false);

$('muteBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('muteBtn').addEventListener('click', e => {
  e.stopPropagation();
  AudioSys.setMuted(!AudioSys.muted);
  $('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
});
$('retryBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('retryBtn').addEventListener('click', e => { e.stopPropagation(); resetGame(); });

// ---------- 流程 ----------
function startGame() {
  AudioSys.init();
  if (AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
  state = 'run';
  $('startScreen').style.opacity = 0;
  setTimeout(() => $('startScreen').style.display = 'none', 500);
  $('hud').style.opacity = 1;
}
function resetGame() {
  obstacles = [];
  while (world.children.length) world.remove(world.children[0]);
  trailPts.length = 0; rebuildTrail();
  dist = 0; speed = 0; px = 0; pvx = 0; py = 0; pvy = 0; grounded = true;
  targetX = 0; pointerActive = false; speedTier = 0;
  spawnAt = 30; decorAt = 10; flagAt = 120;
  penguinFly = null;
  grounds[0].position.z = 0; grounds[1].position.z = -GROUND_LEN;
  grounds.forEach(computeGround);
  penguin.position.set(0, 0, 0); penguin.rotation.set(0, Math.PI, 0);
  player.rotation.set(0, 0, 0);
  setOpacity(mountainBack, 1); setOpacity(cityBack, 0);
  prefill();
  $('overScreen').classList.remove('show');
  $('dist').textContent = '0m';
  $('hud').style.opacity = 1;
  state = 'run';
}
function crash() {
  state = 'crash';
  crashT = 0;
  AudioSys.crash();
  AudioSys.update(0, 0);
  penguinFly = { vx: pvx * .12, vy: 7.5, vz: 6, rot: (Math.random() - .5) * 10 };
  burstPuffs(px, terrainH(dist) + .2, 0, 14, 6);  // 撞擊雪爆
  if (navigator.vibrate) navigator.vibrate(80);
}
function showToast(txt) {
  const t = $('toast');
  t.textContent = txt;
  t.classList.remove('show');
  void t.offsetWidth;  // 重新觸發動畫
  t.classList.add('show');
  AudioSys.blip(660, .25, .1, 'triangle');
}
function showOver() {
  state = 'over';
  const d = Math.floor(dist);
  const isBest = d > best;
  if (isBest) { best = d; localStorage.setItem(BEST_KEY, best); }
  $('ovDist').textContent = d + 'm';
  $('ovBest').textContent = best + 'm';
  $('newBest').style.visibility = isBest ? 'visible' : 'hidden';
  $('hud').style.opacity = 0;
  $('overScreen').classList.add('show');
}

// ---------- 主迴圈 ----------
let lastT = performance.now(), trailAcc = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - lastT) / 1000, .05);
  lastT = now;

  if (state === 'run' || state === 'crash') {
    if (state === 'run') {
      // 底速漸進 16→40，下坡再加速、上坡減速（最高 46）
      const baseSpd = Math.min(40, 16 + dist * .03);
      const targetSpd = THREE.MathUtils.clamp(baseSpd * (1 - terrainSlope(dist) * 2.4), 13, 46);
      speed += (targetSpd - speed) * Math.min(dt * 1.8, 1);
      dist += speed * dt;
      $('dist').textContent = Math.floor(dist) + 'm';
      const tier = Math.floor(dist / 250);
      if (tier > speedTier) { speedTier = tier; showToast('加速！'); }

      // 鍵盤轉向
      if (keys.ArrowLeft || keys.a || keys.A) { targetX = px - 5; pointerActive = false; }
      else if (keys.ArrowRight || keys.d || keys.D) { targetX = px + 5; pointerActive = false; }
      else if (!pointerActive) targetX = px;

      // 橫向移動（追 targetX）
      const maxLat = speed * .95;
      const want = THREE.MathUtils.clamp((targetX - px) * 5.5, -maxLat, maxLat) * (grounded ? 1 : .45);
      pvx += (want - pvx) * Math.min(dt * 9, 1);
      px = THREE.MathUtils.clamp(px + pvx * dt, -TRACK_HALF, TRACK_HALF);

      // 跳躍物理
      if (!grounded) {
        pvy -= GRAV * dt;
        py += pvy * dt;
        if (py <= 0) { py = 0; grounded = true; burstPuffs(px, terrainH(dist) + .1, .3, 7, 4); }  // 落地噴雪
      }

      // 轉彎側噴雪
      if (grounded && Math.abs(pvx) > 7 && Math.random() < dt * 18)
        spawnPuff(px - Math.sign(pvx) * .7, terrainH(dist) + .15, .4,
          -pvx * .18, 1.5 + Math.random() * 2, 1.5, .5 + Math.random() * .5);

      spawnStep();

      // 雪痕
      trailAcc += speed * dt;
      if (grounded && trailAcc > .55) {
        trailAcc = 0;
        trailPts.push({ x: px, z: 0, y: terrainH(dist) + .14 });
        if (trailPts.length > TRAIL_MAX) trailPts.shift();
      }
    } else {  // crash 動畫
      crashT += dt;
      speed = Math.max(0, speed - 26 * dt);
      if (penguinFly) {
        penguin.position.x += penguinFly.vx * dt * 10;
        penguin.position.y += penguinFly.vy * dt;
        penguin.position.z += penguinFly.vz * dt;
        penguinFly.vy -= GRAV * dt * .8;
        penguin.rotation.x += penguinFly.rot * dt;
        if (penguin.position.y < .1 && penguinFly.vy < 0) {
          penguin.position.y = .1; penguinFly.vy = 0; penguinFly.vz *= .6; penguinFly.rot *= .5;
        }
      }
      if (crashT > 1) showOver();
    }

    // 世界前進
    for (let i = world.children.length - 1; i >= 0; i--) {
      const o = world.children[i];
      o.position.z += speed * dt;
      if (o.position.z > KILL_Z) {
        world.remove(o);
        const k = obstacles.findIndex(t => t.g === o);
        if (k >= 0) obstacles.splice(k, 1);
      }
    }
    for (const p of trailPts) p.z += speed * dt;
    while (trailPts.length && trailPts[0].z > KILL_Z) trailPts.shift();
    rebuildTrail();

    // 地面接力（換段時重算坡面）
    for (const g of grounds) {
      g.position.z += speed * dt;
      if (g.position.z > GROUND_LEN / 2 + 20) { g.position.z -= GROUND_LEN * 2; computeGround(g); }
    }

    // 碰撞（跳起時可越過）
    if (state === 'run') {
      for (const ob of obstacles) {
        const oz = ob.g.position.z, ox = ob.g.position.x;
        if (oz > -1.4 && oz < 1.4 && Math.abs(px - ox) < ob.r + .62) {
          if (ob.ramp) {
            if (grounded) { grounded = false; pvy = 8.5 + speed * .12; AudioSys.jump(); }
          } else if (py < 1.1) { crash(); break; }
        }
      }
    }

    // 主題背景交替
    const cyc = dist % THEME_LEN, cur = themeAt(dist);
    let cityO = cur === 1 ? 1 : 0;
    if (cyc > THEME_LEN - 80) {  // 過場漸變
      const f = (cyc - (THEME_LEN - 80)) / 80;
      cityO = cur === 1 ? 1 - f : f;
    }
    setOpacity(cityBack, cityO);
    setOpacity(mountainBack, 1 - cityO);

    AudioSys.update(speed, state === 'run' ? pvx : 0);
  }

  // 玩家姿態（貼合坡面、上下坡俯仰）
  const gy = terrainH(dist);
  player.position.set(px, gy + py, 0);
  if (state === 'run' || state === 'title') {
    const lean = THREE.MathUtils.clamp(pvx * .045, -.6, .6);
    player.rotation.y = -lean * .9;
    player.rotation.z = -lean * .55;
    player.rotation.x = grounded ? Math.atan(terrainSlope(dist)) : -.2;
    penguin.position.y = grounded ? 0 : .08;
  }
  shadow.position.set(px, gy + .025, 0);
  shadow.scale.setScalar(Math.max(.4, 1 - py * .18));

  // 相機（跟著坡面起伏、視線看向前方坡道；越快視野越廣）
  camera.position.set(px * .5, 5 + gy + py * .25, 16);
  camera.lookAt(px * .85, -4.2 + gy * .45 + terrainH(dist + 34) * .55, -20);
  camera.fov = 58 + THREE.MathUtils.clamp((speed - 16) * .3, 0, 10);
  camera.updateProjectionMatrix();

  // 飄雪
  {
    const arr = snowPts.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] -= dt * (2 + (i % 5));
      arr[i + 2] += speed * dt * .3;
      if (arr[i + 1] < 0) { arr[i + 1] = 26; arr[i] = Math.random() * 60 - 30; arr[i + 2] = Math.random() * 80 - 60; }
    }
    snowPts.geometry.attributes.position.needsUpdate = true;
  }

  updatePuffs(dt, (state === 'run' || state === 'crash') ? speed : 0);

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
