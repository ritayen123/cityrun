<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe4f4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SLED RUN 企鵝雪橇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: ui-rounded, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background: #cfe4f4;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* HUD */
  #hud { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding-top: 18px;
    text-align: center; opacity: 0; transition: opacity .4s; }
  #dist { font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 rgba(122,156,196,.55), 0 6px 18px rgba(90,130,175,.35); letter-spacing: 1px; }
  #fishHud { position: absolute; left: 16px; top: 14px; background: rgba(255,255,255,.75);
    border-radius: 20px; padding: 8px 14px; font-size: 16px; font-weight: 800; color: #4d6a82;
    box-shadow: 0 3px 10px rgba(90,130,175,.25); }
  #buffs { position: absolute; left: 18px; top: 62px; font-size: 17px; font-weight: 800;
    color: #4d6a82; text-align: left; text-shadow: 0 1px 0 #fff; }

  #toast { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 34px;
    font-weight: 900; color: #ffd98a; text-shadow: 0 2px 0 #e8862e, 0 6px 16px rgba(200,110,30,.4);
    opacity: 0; }
  #toast.show { animation: toastPop 1.1s ease-out; }
  @keyframes toastPop { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.12); }
    35% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }

  #muteBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px;
    width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.75);
    font-size: 20px; pointer-events: auto; cursor: pointer; box-shadow: 0 3px 10px rgba(90,130,175,.25); }

  /* 主選單 */
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    pointer-events: auto; transition: opacity .35s; overflow-y: auto; }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  #walletRow { display: flex; gap: 8px; width: 100%; justify-content: flex-start; }
  .pill { background: rgba(255,255,255,.8); border-radius: 20px; padding: 8px 14px; font-weight: 800;
    color: #4d6a82; font-size: 15px; box-shadow: 0 3px 10px rgba(90,130,175,.2); }
  #menuTitle { margin-top: 3vh; font-size: min(13vw, 58px); font-weight: 900; color: #fff; letter-spacing: 2px;
    text-shadow: 0 3px 0 #a8c4e0, 0 10px 26px rgba(90,130,175,.4); }
  #menuSub { font-size: 13px; font-weight: 700; color: #7d9cbd; letter-spacing: 6px; margin-bottom: 2vh; }
  .mBtn { width: min(78vw, 320px); margin-top: 12px; padding: 14px 0; border: none; border-radius: 26px;
    font-family: inherit; font-size: 18px; font-weight: 800; color: #fff; cursor: pointer;
    box-shadow: 0 6px 16px rgba(90,130,175,.3); }
  .mBtn small { display: block; font-size: 12px; font-weight: 700; opacity: .9; margin-top: 2px; }
  .mBtn:active { transform: scale(.97); }
  #btnLevel { background: linear-gradient(180deg, #ffb35c, #f28c2e); }
  #btnEndless { background: linear-gradient(180deg, #7fb2e8, #4f86c8); }
  #btnShop { background: linear-gradient(180deg, #8ed08f, #5aa86c); }
  #dailyPanel { width: min(88vw, 344px); margin-top: 2.2vh; background: rgba(255,255,255,.85);
    border-radius: 18px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(90,130,175,.2); }
  #dailyPanel h4 { font-size: 13px; color: #8ba3bd; letter-spacing: 2px; margin-bottom: 4px; text-align: left; }
  .taskRow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #4d6a82;
    font-weight: 700; margin: 8px 0; }
  .taskRow .tn { flex: 1.4; text-align: left; }
  .taskRow .bar { flex: 1; height: 6px; background: #dde8f2; border-radius: 3px; overflow: hidden; }
  .taskRow .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb35c, #f28c2e); }
  .claimBtn { border: none; border-radius: 12px; padding: 5px 10px; font-family: inherit; font-size: 12px;
    font-weight: 800; color: #fff; background: linear-gradient(180deg, #ffb35c, #f28c2e); cursor: pointer; }
  .claimBtn:disabled { background: #c9d6e2; }
  /* 通用覆蓋頁 */
  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    background: rgba(240,246,252,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: opacity .3s; pointer-events: auto; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
  .ovTitle { font-size: 30px; font-weight: 900; color: #fff; letter-spacing: 2px; margin: 6px 0 14px;
    text-shadow: 0 3px 0 #a8c4e0, 0 8px 22px rgba(90,130,175,.4); }
  .backBtn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 14px;
    width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,.88);
    font-size: 18px; font-weight: 800; color: #4d6a82; cursor: pointer;
    box-shadow: 0 3px 10px rgba(90,130,175,.25); }
  /* 選關 */
  #lvGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(88vw, 360px); }
  .lvNode { background: rgba(255,255,255,.9); border-radius: 18px; padding: 13px 8px; text-align: center;
    cursor: pointer; box-shadow: 0 5px 14px rgba(90,130,175,.22); border: none; font-family: inherit; }
  .lvNode.lock { opacity: .45; }
  .lvNode .n { font-size: 21px; font-weight: 900; color: #4d6a82; }
  .lvNode .len { font-size: 11px; color: #8ba3bd; font-weight: 700; }
  .lvNode .st { font-size: 13px; color: #f0a132; letter-spacing: 2px; margin-top: 2px; min-height: 16px; }
  /* 商店 */
  #shopTabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabBtn { border: none; border-radius: 16px; padding: 8px 18px; font-family: inherit; font-weight: 800;
    font-size: 14px; color: #6f8cab; background: rgba(255,255,255,.6); cursor: pointer; }
  .tabBtn.on { background: #fff; color: #f28c2e; box-shadow: 0 3px 10px rgba(90,130,175,.25); }
  .shopRow { display: flex; align-items: center; gap: 10px; width: min(88vw, 360px);
    background: rgba(255,255,255,.9); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    box-shadow: 0 4px 12px rgba(90,130,175,.18); }
  .shopRow .ic { font-size: 26px; width: 34px; }
  .shopRow .info { flex: 1; text-align: left; }
  .shopRow .nm { font-size: 15px; font-weight: 800; color: #4d6a82; }
  .shopRow .ds { font-size: 12px; color: #8ba3bd; font-weight: 600; }
  .buyBtn { border: none; border-radius: 14px; padding: 8px 12px; font-family: inherit; font-size: 13px;
    font-weight: 800; color: #fff; background: linear-gradient(180deg, #ffb35c, #f28c2e);
    cursor: pointer; white-space: nowrap; }
  .buyBtn:disabled { background: #c9d6e2; }
  .buyBtn.eq { background: linear-gradient(180deg, #8ed08f, #5aa86c); }
  .dot { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 -3px 6px rgba(0,0,0,.18); }
  /* 過關/簽到/復活 */
  #clearStars { font-size: 44px; letter-spacing: 10px; margin: 4px 0 10px; }
  #clearScreen:not(.hide) #clearStars { animation: starPop .6s ease-out; }
  @keyframes starPop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #signinCard { background: rgba(255,255,255,.94); border-radius: 22px; padding: 20px 22px; text-align: center;
    box-shadow: 0 10px 30px rgba(90,130,175,.3); width: min(84vw, 330px); margin: auto 0; }
  #signinDays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0; }
  .dayChip { border-radius: 12px; padding: 8px 0 6px; font-size: 11px; font-weight: 800; color: #8ba3bd;
    background: #eef4fa; }
  .dayChip b { display: block; font-size: 12px; color: #4d6a82; }
  .dayChip.got { background: #dff0dd; color: #5aa86c; }
  .dayChip.today { background: linear-gradient(180deg, #ffd9a3, #ffc16e); color: #9a5c14; }
  .dayChip.today b { color: #7b4308; }
  #reviveBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: rgba(240,246,252,.35); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); pointer-events: auto; transition: opacity .3s; }
  #revCount { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: flex;
    align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #f28c2e;
    box-shadow: 0 6px 18px rgba(90,130,175,.3); margin-bottom: 6px; }
  .ghostBtn { background: rgba(255,255,255,.85) !important; color: #6f8cab !important; }
  /* 橫向提示（手機轉橫時） */
  #rotateHint { position: fixed; inset: 0; z-index: 99; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; background: #cfe4f4;
    font-size: 18px; font-weight: 800; color: #4d6a82; }
  #rotateHint span { font-size: 44px; }
  @media (orientation: landscape) and (max-height: 520px) { #rotateHint { display: flex; } }

  /* 結算 */
  #overScreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(240,246,252,.35); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #overScreen.show { opacity: 1; pointer-events: auto; }
  #overTitle { font-size: 46px; font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 #a8c4e0, 0 8px 22px rgba(90,130,175,.4); letter-spacing: 3px; }
  #newBest { margin-top: 6px; font-size: 15px; font-weight: 800; color: #e8a13c; letter-spacing: 2px;
    visibility: hidden; }
  #overCard { margin-top: 22px; background: rgba(255,255,255,.88); border-radius: 22px; padding: 22px 40px;
    box-shadow: 0 10px 30px rgba(90,130,175,.25); text-align: center; }
  .statRow { display: flex; justify-content: space-between; gap: 44px; font-size: 17px; margin: 8px 0; }
  .statRow .k { color: #8ba3bd; font-weight: 600; }
  .statRow .v { color: #4d6a82; font-weight: 800; }
  #retryBtn { margin-top: 26px; padding: 15px 52px; font-size: 19px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #ffb35c, #f28c2e); border: none; border-radius: 30px;
    box-shadow: 0 6px 18px rgba(242,140,46,.45); cursor: pointer; font-family: inherit; }
  #retryBtn:active { transform: scale(.96); }
</style>

<body>
<div id="ui">
  <div id="hud"><div id="dist">0m</div><div id="fishHud">🐟 0</div><div id="buffs"></div></div>
  <div id="toast"></div>
  <button id="muteBtn">🔊</button>
  <div id="rotateHint"><span>📱</span>請將手機轉回直向</div>
  <!-- 主選單 -->
  <div id="menu">
    <div id="walletRow"><span class="pill" id="mFish">🐟 0</span><span class="pill" id="mTicket">❤️ 0</span></div>
    <div id="menuTitle">SLED RUN</div>
    <div id="menuSub">企鵝雪橇</div>
    <button class="mBtn" id="btnLevel">關卡模式<small id="lvHint">第 1 關</small></button>

  <!-- 商店 -->
  <div id="shop" class="ov hide">
    <button class="backBtn" data-back="shop">‹</button>

    <div id="shopTabs">
      <button class="tabBtn on" data-tab="up">升級</button>
      <button class="tabBtn" data-tab="skin">皮膚</button>

  <!-- 過關 -->

    <div class="ovTitle" id="clearTitle">過關！</div>

    <div id="overCardC" style="background:rgba(255,255,255,.9);border-radius:22px;padding:20px 38px;box-shadow:0 10px 30px rgba(90,130,175,.25)">
      <div class="statRow"><span class="k">收集小魚</span><span class="v" id="clFish">0</span></div>
      <div class="statRow"><span class="k">過關獎勵</span><span class="v" id="clBonus">0</span></div>
      <div class="statRow"><span class="k">存入錢包</span><span class="v" id="clTotal">0 🐟</span></div>
    </div>
    <button class="mBtn" id="clNext" style="background:linear-gradient(180deg,#ffb35c,#f28c2e)">下一關</button>
    <button class="mBtn ghostBtn" id="clMenu">主選單</button>
  </div>
  <!-- 復活 -->
  <div id="reviveBox" class="hide">
    <div style="font-size:24px;font-weight:900;color:#4d6a82">繼續滑行？</div>
    <div id="revCount">5</div>
    <button class="mBtn" id="revTicket" style="background:linear-gradient(180deg,#f08a8a,#d84848)">❤️ 用復活券（剩 0）</button>
    <button class="mBtn" id="revFish" style="background:linear-gradient(180deg,#ffb35c,#f28c2e)">🐟 150 復活</button>

      <div class="statRow"><span class="k">距離</span><span class="v" id="ovDist">0m</span></div>
      <div class="statRow"><span class="k">小魚</span><span class="v" id="ovFish">0</span></div>
      <div class="statRow"><span class="k">分數</span><span class="v" id="ovScore">0</span></div>

<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script>
'use strict';
/* ============ SLED RUN 企鵝雪橇 ============
   自由轉向下坡雪橇跑酷（複刻 sled.surfers 風格）
   雪山關與雪城市關每 420m 交替出現           */

// ---------- 基本常數 ----------
const TRACK_HALF = 10.8;        // 可滑行半寬
const SPAWN_Z = -170;           // 生成距離
const KILL_Z = 22;              // 回收距離
const THEME_LEN = 420;          // 每個主題長度（公尺）
const GRAV = 22;
const BEST_KEY = 'cityrun_sled_best';

// ---------- 地形起伏（s = 滑道座標，公尺；正弦疊加出連綿上下坡） ----------
function terrainH(s) {
  const e = Math.min(1, Math.max(0, s / 120));  // 開頭 120m 漸入
  return e * (4.2 * Math.sin(s * .024) + 2.6 * Math.sin(s * .010 + 2));
}
function terrainSlope(s) {
  const e = Math.min(1, Math.max(0, s / 120));
  return e * (4.2 * .024 * Math.cos(s * .024) + 2.6 * .010 * Math.cos(s * .010 + 2));
}

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe9f5, 60, 250);

// 天空漸層（日／夜兩套）
function makeSky(top, mid, bot) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(.55, mid); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const skyDay = makeSky('#a9cdea', '#cbe1f2', '#eef5fb');
const skyNight = makeSky('#1e2c47', '#35496b', '#5b6f92');
scene.background = skyDay;

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 400);

const hemi = new THREE.HemisphereLight(0xcfe2f5, 0xffffff, .95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, .85);
sun.position.set(-30, 60, -20);
scene.add(sun);

// ---------- 材質工具 ----------
const MAT = {};
function mat(color, opt) {
  const key = color + JSON.stringify(opt || {});
  if (!MAT[key]) MAT[key] = new THREE.MeshLambertMaterial(Object.assign({ color }, opt));
  return MAT[key];
}
function mesh(geo, m, x, y, z, parent) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  (parent || scene).add(o);
  return o;
}

// ---------- 雪地（兩塊接力） ----------
const snowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f8fd'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 26; i++) {  // 大片淡藍雪影
    g.fillStyle = 'rgba(196,215,238,.16)';
    g.beginPath();
    g.ellipse(Math.random() * 256, Math.random() * 256, 24 + Math.random() * 44, 14 + Math.random() * 26, Math.random() * 3, 0, 7);
    g.fill();
  }
  for (let i = 0; i < 420; i++) {
    g.fillStyle = Math.random() < .5 ? 'rgba(190,210,235,.14)' : 'rgba(255,255,255,.3)';
    const r = Math.random() * 1.6 + .4;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 50; i++) {  // 亮晶晶
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.fillRect(Math.random() * 256, Math.random() * 256, 1.4, 1.4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 12); t.encoding = THREE.sRGBEncoding;
  return t;
})();
const GROUND_LEN = 240;
const grounds = [0, 1].map(i => {
  const p = mesh(new THREE.PlaneGeometry(140, GROUND_LEN, 1, 80),
    new THREE.MeshLambertMaterial({ color: 0xf5f9fd, map: snowTex }), 0, 0, -i * GROUND_LEN);
  p.rotation.x = -Math.PI / 2;
  return p;
});
const groundMats = grounds.map(g => g.material);
// 夜間關卡配色切換
function applyNight(on) {
  scene.background = on ? skyNight : skyDay;
  scene.fog.color.setHex(on ? 0x3a4a63 : 0xdfe9f5);
  hemi.intensity = on ? .55 : .95;
  sun.intensity = on ? .35 : .85;
  groundMats.forEach(m => m.color.setHex(on ? 0xc9d4e8 : 0xf5f9fd));
}
// 依滑道座標把地面頂點抬成坡面（換段接力時重算一次即可）
function computeGround(p) {
  const pos = p.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const s = dist - p.position.z + pos.getY(i);  // 該頂點的滑道座標

function rebuildTrail() {
  const n = trailPts.length;
  for (let i = 0; i < n; i++) {
    const p = trailPts[i];
    const q = trailPts[Math.min(i + 1, n - 1)], o = trailPts[Math.max(i - 1, 0)];
    let dx = q.x - o.x, dz = q.z - o.z;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    const w = .62 * (.35 + .65 * (i / Math.max(n, 1)));  // 越舊越窄
    const y = (p.y || .03) + i * .0004;
    trailPos[i * 6] = p.x - dz * w; trailPos[i * 6 + 1] = y; trailPos[i * 6 + 2] = p.z + dx * w;
    trailPos[i * 6 + 3] = p.x + dz * w; trailPos[i * 6 + 4] = y; trailPos[i * 6 + 5] = p.z - dx * w;
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  trailGeo.setIndex(idx);
  trailGeo.attributes.position.needsUpdate = true;
}

let puffIdx = 0;
function spawnPuff(x, y, z, vx, vy, vz, scale) {
  const p = puffs[puffIdx = (puffIdx + 1) % puffs.length];
  p.m.position.set(x, y, z);
  p.m.scale.setScalar(scale || 1);
  p.m.visible = true;
  p.life = 1;
  p.vx = vx; p.vy = vy; p.vz = vz;
}
function burstPuffs(x, y, z, n, power) {
  for (let i = 0; i < n; i++)
    spawnPuff(x + (Math.random() - .5), y + Math.random() * .5, z + (Math.random() - .5),
      (Math.random() - .5) * power, 2 + Math.random() * power, (Math.random() - .3) * power, .7 + Math.random() * .9);
}
function updatePuffs(dt, worldSpeed) {
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt * 1.8;
    if (p.life <= 0) { p.m.visible = false; continue; }
    p.vy -= 14 * dt;
    p.m.position.x += p.vx * dt;
    p.m.position.y += p.vy * dt;
    p.m.position.z += (p.vz + worldSpeed) * dt;
    p.m.material.opacity = p.life * .9;
    p.m.scale.multiplyScalar(1 - dt * .8);
  }
}

// ---------- 音效（WebAudio 程序化） ----------
const AudioSys = {
  ctx: null, muted: false, windGain: null, windFilter: null, carveGain: null,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const mk = (freq, gain, type) => {
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
      return [f, g];
    };
    [this.windFilter, this.windGain] = mk(320, 0);
    [, this.carveGain] = mk(900, 0, 'bandpass');
  },
  update(speed, vx) {
    if (!this.ctx || this.muted) return;
    this.windGain.gain.value = .015 + speed / 30 * .06;
    this.windFilter.frequency.value = 260 + speed * 14;
    this.carveGain.gain.value = Math.min(Math.abs(vx) / 18, 1) * .05;
  },
  blip(freq, dur, vol, type) {
    if (!this.ctx || this.muted) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  jump() { this.blip(420, .3, .12, 'triangle'); },
  crash() { this.blip(90, .5, .3, 'square'); this.blip(60, .6, .25, 'sine'); },
  setMuted(v) {
    this.muted = v;
    if (this.windGain) { this.windGain.gain.value = 0; this.carveGain.gain.value = 0; }
  }
};

function place(g, x, z) {

function spawnStep() {
  const aheadTheme = themeAt(dist - SPAWN_Z);
  const dens = mode === 'level' ? lvConf.dens : 1;
  const gap = Math.max(11, 19 - dist * .01) / dens;  // 障礙間距隨距離與關卡難度縮短
  // 關卡模式：終點門與終點前停止生成（門提早 20m，過線後布條先滑出畫面再結算）
  const noMore = mode === 'level' && dist >= lvConf.len - 210;
  if (mode === 'level' && !finishSpawned && dist - SPAWN_Z >= lvConf.len - 20) {
    finishSpawned = true;
    place(makeFinishGate(), 0, SPAWN_Z);
  }
  if (!noMore && dist >= spawnAt) {
    spawnAt = dist + gap * (0.7 + Math.random() * .6);
    const x = (Math.random() * 2 - 1) * (TRACK_HALF - 1);
    const roll = Math.random();
    let g;
    if (roll < (RAMP_BOOST ? .6 : .13)) g = makeRamp();
    else if (aheadTheme === 0) g = roll < .6 ? makeSnowTree() : makeRock();
    else g = roll < .45 ? makeCrate() : roll < .7 ? makePole() : roll < .85 ? makeKiosk() : makeSnowTree();
    place(g, x, SPAWN_Z);
    // 跳台上空掛一道小魚弧線（起跳才吃得到）
    if (g.userData.ramp && Math.random() < .55) {
      [1.6, 2.7, 3.3, 2.7, 1.6].forEach((h, i) =>
        placeItem(makeFishItem(), x, SPAWN_Z - 5 - i * 2.2, 'fish', h));
    }
    // 偶爾一排雙障礙
    if (dist > 150 && Math.random() < .3) {
      const x2 = x > 0 ? x - (6 + Math.random() * 6) : x + (6 + Math.random() * 6);
      const g2 = aheadTheme === 0 ? (Math.random() < .6 ? makeSnowTree() : makeRock()) : makeCrate();
      place(g2, THREE.MathUtils.clamp(x2, -TRACK_HALF + 1, TRACK_HALF - 1), SPAWN_Z - 3);
    }
  }
  if (dist >= decorAt) {
    decorAt = dist + 13;
    [-1, 1].forEach(s => {
      if (aheadTheme === 0) {
        place(makeBorderPost(), s * (TRACK_HALF + 1.6), SPAWN_Z + Math.random() * 6);
        const r = Math.random();
        if (r < .5) place(makeSnowTree(), s * (TRACK_HALF + 4 + Math.random() * 6), SPAWN_Z);

    flagAt = dist + 40 + Math.random() * 25;
    place(makeFlagLine(), 0, SPAWN_Z);

  if (!noMore && dist >= fishAt) {
    fishAt = dist + 26 + Math.random() * 30;
    const fx = (Math.random() * 2 - 1) * (TRACK_HALF - 2);
    for (let i = 0; i < 5; i++) placeItem(makeFishItem(), fx, SPAWN_Z - i * 2.4, 'fish');

  }
}

// ---- 結算與過關 ----
function bankRun() {  // 魚入錢包（今日首局雙倍）＋每日任務進度
  let banked = fishCount;
  if (fishCount > 0 && S.daily.firstRunDate !== todayStr()) {
    S.daily.firstRunDate = todayStr();
    banked = fishCount * 2;
  }
  S.fish += banked;
  for (const task of S.daily.tasks) {
    if (task.claimed) continue;
    const def = TASK_POOL.find(d => d.id === task.id);
    if (!def) continue;
    if (def.stat === 'maxDist') task.p = Math.max(task.p, Math.floor(dist));
    else if (def.stat === 'maxFish') task.p = Math.max(task.p, fishCount);
    else if (def.stat === 'fish') task.p += fishCount;
    else if (def.stat === 'jumps') task.p += runJumps;
    else if (def.stat === 'smash') task.p += runSmash;
    else if (def.stat === 'items') task.p += runItems;
    else if (def.stat === 'runs') task.p += 1;
    task.p = Math.min(task.p, def.target);
  }
  save();
  return banked;
}
function finishRun() {
  state = 'over';
  const banked = bankRun();
  const d = Math.floor(dist);
  if (mode === 'endless') {
    const score = d + fishCount * 10;
    const isBest = score > S.best;
    if (isBest) { S.best = score; save(); }
    $('overTitle').textContent = '哎呀！';
    $('ovScore').parentElement.style.display = '';
    $('ovBest').parentElement.style.display = '';
    $('ovDist').textContent = d + 'm';
    $('ovScore').textContent = score;
    $('ovBest').textContent = S.best;
    $('newBest').style.visibility = isBest ? 'visible' : 'hidden';
    $('retryBtn').textContent = '再滑一次';
  } else {
    $('overTitle').textContent = '未完成…';
    $('ovDist').textContent = d + '/' + lvConf.len + 'm';
    $('ovScore').parentElement.style.display = 'none';
    $('ovBest').parentElement.style.display = 'none';
    $('newBest').style.visibility = 'hidden';
    $('retryBtn').textContent = '再試一次';
  }
  $('ovFish').textContent = banked > fishCount ? `${fishCount} ×2 = ${banked} 🎉` : fishCount;
  $('hud').style.opacity = 0;
  $('overScreen').classList.add('show');
}
function levelClear() {
  state = 'clear';
  AudioSys.blip(660, .25, .14, 'triangle');
  AudioSys.blip(880, .5, .14, 'triangle');
  burstPuffs(px, terrainH(dist) + 1, 0, 16, 6);
  const stars = 1 + (fishCount >= lvConf.fishGoal ? 1 : 0) + (diedThisRun ? 0 : 1);
  S.stars[curLv] = Math.max(S.stars[curLv] || 0, stars);
  S.unlocked = Math.max(S.unlocked, Math.min(curLv + 2, LEVELS.length));
  const bonus = 100 + curLv * 50;
  const banked = bankRun();
  S.fish += bonus;
  save();
  $('clearTitle').textContent = `第 ${curLv + 1} 關 過關！`;
  $('clearStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('clFish').textContent = (banked > fishCount ? `${fishCount} ×2！` : fishCount) +
    (fishCount >= lvConf.fishGoal ? '（達標 ★）' : '／目標 ' + lvConf.fishGoal);
  $('clBonus').textContent = bonus;
  $('clTotal').textContent = (banked + bonus) + ' 🐟';
  $('clNext').style.display = curLv + 1 < LEVELS.length ? '' : 'none';
  $('hud').style.opacity = 0;
  show('clearScreen');
}

// ---- 復活 ----
let revTimer = null, revLeft = 5;
function showRevive() {
  state = 'revive';
  revLeft = 5;
  $('revCount').textContent = revLeft;
  $('revTicket').textContent = `❤️ 用復活券（剩 ${S.tickets}）`;
  $('revTicket').style.display = S.tickets > 0 ? '' : 'none';
  $('revFish').textContent = `🐟 ${REVIVE_FISH} 復活（錢包 ${S.fish}）`;
  $('revFish').style.display = S.fish >= REVIVE_FISH ? '' : 'none';
  show('reviveBox');
  revTimer = setInterval(() => {
    revLeft--;
    $('revCount').textContent = revLeft;
    if (revLeft <= 0) { clearInterval(revTimer); giveUp(); }
  }, 1000);
}
function doRevive(useTicket) {
  if (useTicket) { if (S.tickets <= 0) return; S.tickets--; }
  else { if (S.fish < REVIVE_FISH) return; S.fish -= REVIVE_FISH; }
  clearInterval(revTimer);
  save();
  for (let i = obstacles.length - 1; i >= 0; i--) {  // 清掉眼前障礙避免秒死
    if (obstacles[i].g.position.z > -30 && !obstacles[i].ramp) {
      world.remove(obstacles[i].g);
      obstacles.splice(i, 1);
    }
  }
  penguinFly = null;
  penguin.position.set(0, 0, 0); penguin.rotation.set(0, Math.PI, 0);
  py = 0; pvy = 0; pvx = 0; grounded = true; invulnT = 2;
  hide('reviveBox');
  state = 'run';
}
function giveUp() {
  clearInterval(revTimer);
  hide('reviveBox');
  finishRun();
}
$('revTicket').onclick = () => doRevive(true);
$('revFish').onclick = () => doRevive(false);
$('revGiveup').onclick = giveUp;

// ---- 每日簽到與任務 ----
function todayStr() { return new Date().toDateString(); }
function checkDaily() {
  const today = todayStr();
  if (S.daily.tDate !== today) {  // 換日抽 3 則任務
    S.daily.tDate = today;
    const seed = [...today].reduce((a, c) => a + c.charCodeAt(0), 0);
    const pool = [...TASK_POOL];
    S.daily.tasks = [];
    for (let i = 0; i < 3; i++) {
      const k = (seed * (i + 3) + i * 7) % pool.length;
      S.daily.tasks.push({ id: pool.splice(k, 1)[0].id, p: 0, claimed: false });
    }
    save();
    renderTasks();
  }
  if (S.daily.last !== today) showSignin();
}
function showSignin() {
  const today = todayStr();
  const yest = new Date(Date.now() - 864e5).toDateString();
  const newStreak = S.daily.last === yest ? S.daily.streak + 1 : 1;
  const idx = (newStreak - 1) % 7;
  $('signinStreak').textContent = `連續登入第 ${newStreak} 天`;
  $('signinDays').innerHTML = SIGNIN_REWARDS.map((r, i) =>
    `<div class="dayChip ${i < idx ? 'got' : i === idx ? 'today' : ''}">D${i + 1}<b>${r}</b></div>`).join('');
  $('signinClaim').textContent = `領取 ${SIGNIN_REWARDS[idx]} 🐟`;
  $('signinClaim').onclick = () => {
    S.daily.last = today;
    S.daily.streak = newStreak;
    S.fish += SIGNIN_REWARDS[idx];
    save();
    hide('signinBox');
    renderMenu();
    showToast(`+${SIGNIN_REWARDS[idx]} 🐟`);
  };
  show('signinBox');
}
function renderTasks() {
  $('taskList').innerHTML = S.daily.tasks.map((t, i) => {
    const def = TASK_POOL.find(d => d.id === t.id);
    const pct = Math.min(100, t.p / def.target * 100);
    const done = t.p >= def.target;
    return `<div class="taskRow"><span class="tn">${def.name}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <button class="claimBtn" data-task="${i}" ${done && !t.claimed ? '' : 'disabled'}>${t.claimed ? '已領' : done ? '領 ' + TASK_REWARD : t.p + '/' + def.target}</button></div>`;
  }).join('');
}
$('taskList').addEventListener('click', e => {
  const i = e.target.dataset.task;
  if (i === undefined) return;
  const t = S.daily.tasks[i];
  const def = TASK_POOL.find(d => d.id === t.id);
  if (!t || t.claimed || t.p < def.target) return;
  t.claimed = true;
  S.fish += TASK_REWARD;
  save();
  renderMenu();
  showToast(`+${TASK_REWARD} 🐟`);
});

// ---- 主選單／選關／商店 ----
function renderMenu() {
  $('mFish').textContent = '🐟 ' + S.fish;
  $('mTicket').textContent = '❤️ ' + S.tickets;
  const allClear = LEVELS.every((_, i) => S.stars[i]);
  $('lvHint').textContent = allClear ? '全部通關！' : `第 ${Math.min(S.unlocked, LEVELS.length)} 關`;
  $('bestHint').textContent = `最佳 ${S.best} 分`;

  $('lvGrid').innerHTML = LEVELS.map((lv, i) => {

    return `<button class="lvNode ${locked ? 'lock' : ''}" data-lv="${i}" ${locked ? 'disabled' : ''}>
      <div class="n">${locked ? '🔒' : i + 1}</div>

      <div class="st">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div></button>`;

let shopTab = 'up';
function renderShop() {
  $('sFish').textContent = '🐟 ' + S.fish;
  const el = $('shopList');
  if (shopTab === 'up') {
    el.innerHTML = Object.entries(UPGRADES).map(([k, u]) => {
      const lv = S.up[k], maxed = lv >= u.max;
      return `<div class="shopRow"><span class="ic">${u.icon}</span>
        <span class="info"><div class="nm">${u.name}　Lv${lv}${maxed ? '（滿級）' : ''}</div>
        <div class="ds">${u.desc(lv)}${maxed ? '' : '　→　' + u.desc(lv + 1)}</div></span>
        <button class="buyBtn" data-up="${k}" ${maxed || S.fish < u.price[lv] ? 'disabled' : ''}>${maxed ? 'MAX' : '🐟 ' + u.price[lv]}</button></div>`;
    }).join('');
  } else if (shopTab === 'skin') {
    const row = (sk, kind) => {
      const ownedArr = kind === 'peng' ? S.skins.peng : S.skins.sled;
      const owned = ownedArr.includes(sk.id);
      const eq = (kind === 'peng' ? S.skins.eqPeng : S.skins.eqSled) === sk.id;
      const col = '#' + (sk.body ?? sk.c1).toString(16).padStart(6, '0');
      return `<div class="shopRow"><span class="dot" style="background:${col}"></span>
        <span class="info"><div class="nm">${sk.name}</div><div class="ds">${kind === 'peng' ? '企鵝皮膚' : '雪橇皮膚'}</div></span>
        <button class="buyBtn ${eq ? 'eq' : ''}" data-skin="${kind}:${sk.id}" ${!owned && S.fish < sk.price ? 'disabled' : ''}>${eq ? '使用中' : owned ? '裝備' : '🐟 ' + sk.price}</button></div>`;
    };
    el.innerHTML = PENG_SKINS.map(s => row(s, 'peng')).join('') + SLED_SKINS.map(s => row(s, 'sled')).join('');
  } else {
    el.innerHTML = `<div class="shopRow"><span class="ic">❤️</span>
      <span class="info"><div class="nm">復活券（持有 ${S.tickets}）</div><div class="ds">死亡時免費原地復活一次</div></span>
      <button class="buyBtn" data-buy="ticket" ${S.fish < TICKET_PRICE ? 'disabled' : ''}>🐟 ${TICKET_PRICE}</button></div>`;
  }
}
$('shopList').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.up) {
    const k = b.dataset.up, u = UPGRADES[k];
    if (S.up[k] < u.max && S.fish >= u.price[S.up[k]]) {
      S.fish -= u.price[S.up[k]];
      S.up[k]++;
      AudioSys.blip(700, .2, .1, 'triangle');
    }
  } else if (b.dataset.skin) {
    const [kind, id] = b.dataset.skin.split(':');
    const sk = (kind === 'peng' ? PENG_SKINS : SLED_SKINS).find(s => s.id === id);
    const ownedArr = kind === 'peng' ? S.skins.peng : S.skins.sled;
    if (!ownedArr.includes(id)) {
      if (S.fish < sk.price) return;
      S.fish -= sk.price;
      ownedArr.push(id);
    }
    if (kind === 'peng') S.skins.eqPeng = id; else S.skins.eqSled = id;
    applySkins();
    AudioSys.blip(760, .2, .1, 'triangle');
  } else if (b.dataset.buy === 'ticket') {
    S.fish -= TICKET_PRICE;
    S.tickets++;
    AudioSys.blip(700, .2, .1, 'triangle');
  } else return;
  save();
  renderShop();

document.querySelectorAll('.tabBtn').forEach(b => b.addEventListener('click', () => {

$('lvGrid').addEventListener('click', e => {

$('btnLevel').onclick = () => { renderLevels(); show('lvSelect'); };

document.querySelectorAll('.backBtn').forEach(b => b.onclick = () => { hide(b.dataset.back); renderMenu(); });

$('clMenu').onclick = showMenu;
$('ovMenu').onclick = showMenu;

// ---------- 主迴圈 ----------
let lastT = performance.now(), trailAcc = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - lastT) / 1000, .05);
  lastT = now;

  if (state === 'run' || state === 'crash') {
    if (state === 'run') {
      // 道具計時
      magnetT = Math.max(0, magnetT - dt);
      boostT = Math.max(0, boostT - dt);
      invulnT = Math.max(0, invulnT - dt);
      dashT = Math.max(0, dashT - dt);
      starT = Math.max(0, starT - dt);
      bulletT = Math.max(0, bulletT - dt);
      lightningT = Math.max(0, lightningT - dt);
      // 底速漸進 16→40，下坡再加速、上坡減速；道具加成擇強生效
      const baseSpd = Math.min(40, 16 + dist * .03) * (mode === 'level' ? lvConf.spd : 1);
      const boostMul = dashT > 0 ? 1.9 : bulletT > 0 ? 1.8 : starT > 0 ? 1.5 : boostT > 0 ? 1.35 : 1;
      const capSpd = (dashT > 0 || bulletT > 0 || starT > 0) ? 60 : 52;
      const targetSpd = THREE.MathUtils.clamp(baseSpd * (1 - terrainSlope(dist) * 2.4) * boostMul, 13, capSpd);
      speed += (targetSpd - speed) * Math.min(dt * 1.8, 1);
      dist += speed * dt;
      $('dist').textContent = mode === 'level'
        ? Math.floor(Math.min(dist, lvConf.len)) + '/' + lvConf.len + 'm'
        : Math.floor(dist) + 'm';
      if (mode === 'level' && dist >= lvConf.len) { levelClear(); }
      const tier = Math.floor(dist / 250);
      if (tier > speedTier) { speedTier = tier; showToast('加速！'); }

      // 轉向（子彈企鵝＝自動駕駛追最近的魚）
      if (bulletT > 0) {
        pointerActive = false;
        let bx = 0, bd = 1e9;
        for (const it of items) {
          if (it.type !== 'fish') continue;
          const z = it.g.position.z;
          if (z > -70 && z < -4 && -z < bd) { bd = -z; bx = it.g.position.x; }
        }
        targetX = bx;
      } else if (keys.ArrowLeft || keys.a || keys.A) { targetX = px - 5; pointerActive = false; }
      else if (keys.ArrowRight || keys.d || keys.D) { targetX = px + 5; pointerActive = false; }
      else if (!pointerActive) targetX = px;

      // 橫向移動（追 targetX）
      const maxLat = speed * .95;
      const want = THREE.MathUtils.clamp((targetX - px) * 5.5, -maxLat, maxLat) * (grounded ? 1 : .45);
      pvx += (want - pvx) * Math.min(dt * 9, 1);
      px = THREE.MathUtils.clamp(px + pvx * dt, -TRACK_HALF, TRACK_HALF);

      // 跳躍物理
      if (!grounded) {
        pvy -= GRAV * dt;
        py += pvy * dt;
        if (py <= 0) { py = 0; grounded = true; burstPuffs(px, terrainH(dist) + .1, .3, 7, 4); }  // 落地噴雪
      }

      // 轉彎側噴雪
      if (grounded && Math.abs(pvx) > 7 && Math.random() < dt * 18)
        spawnPuff(px - Math.sign(pvx) * .7, terrainH(dist) + .15, .4,
          -pvx * .18, 1.5 + Math.random() * 2, 1.5, .5 + Math.random() * .5);

      // 磁鐵吸附小魚（星星與子彈期間也自帶吸力）
      if (magnetT > 0 || starT > 0 || bulletT > 0) {
        const gy0 = terrainH(dist);
        for (const it of items) {
          if (it.type !== 'fish') continue;
          const dx = px - it.g.position.x, dz = 0 - it.g.position.z;
          const d = Math.hypot(dx, dz);
          if (d < 11 && d > .1) {
            const pull = 30 * dt / d;
            it.g.position.x += dx * pull;
            it.g.position.z += dz * pull;
            it.baseY += ((gy0 + py + .8) - it.baseY) * Math.min(dt * 6, 1);
          }
        }
      }

      // 收集判定
      {
        const gy0 = terrainH(dist);
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i], oz = it.g.position.z, ox = it.g.position.x;
          if (oz > -1.5 && oz < 1.5 && Math.abs(px - ox) < 1.2 &&
              Math.abs(it.g.position.y - (gy0 + py + .6)) < 1.5) {
            world.remove(it.g);
            items.splice(i, 1);
            if (it.type === 'fish') {
              fishCount++;
              $('fishHud').textContent = '🐟 ' + fishCount;
              AudioSys.blip(880 + (fishCount % 5) * 60, .12, .08, 'triangle');
              spawnPuff(ox, it.g.position.y, oz, 0, 2, 1, .45);
            } else {
              runItems++;
              applyPower(it.type === 'box' ? rollBox() : it.type);
            }
          }
        }
      }

      // HUD 道具徽章
      $('buffs').textContent = [
        shieldOn ? '🛡' : null,
        magnetT > 0 ? '🧲' + Math.ceil(magnetT) : null,
        boostT > 0 ? '🚀' + Math.ceil(boostT) : null,
        starT > 0 ? '⭐' + Math.ceil(starT) : null,
        bulletT > 0 ? '🎈' + Math.ceil(bulletT) : null,
        lightningT > 0 ? '⚡' + Math.ceil(lightningT) : null,
      ].filter(Boolean).join('　');

      spawnStep();

      // 雪痕
      trailAcc += speed * dt;
      if (grounded && trailAcc > .55) {
        trailAcc = 0;
        trailPts.push({ x: px, z: 0, y: terrainH(dist) + .14 });
        if (trailPts.length > TRAIL_MAX) trailPts.shift();
      }
    } else {  // crash 動畫
      crashT += dt;
      speed = Math.max(0, speed - 26 * dt);
      if (penguinFly) {
        penguin.position.x += penguinFly.vx * dt * 10;
        penguin.position.y += penguinFly.vy * dt;
        penguin.position.z += penguinFly.vz * dt;
        penguinFly.vy -= GRAV * dt * .8;
        penguin.rotation.x += penguinFly.rot * dt;
        if (penguin.position.y < .1 && penguinFly.vy < 0) {
          penguin.position.y = .1; penguinFly.vy = 0; penguinFly.vz *= .6; penguinFly.rot *= .5;
        }
      }
      if (crashT > 1) {
        if (S.tickets > 0 || S.fish >= REVIVE_FISH) showRevive();
        else finishRun();
      }
    }

    // 世界前進
    for (let i = world.children.length - 1; i >= 0; i--) {
      const o = world.children[i];
      o.position.z += speed * dt;
      if (o.position.z > KILL_Z) {
        world.remove(o);
        const k = obstacles.findIndex(t => t.g === o);
        if (k >= 0) obstacles.splice(k, 1);
        const k2 = items.findIndex(t => t.g === o);
        if (k2 >= 0) items.splice(k2, 1);
      }
    }
    // 收集物漂浮旋轉
    for (const it of items) {
      it.g.position.y = it.baseY + Math.sin(now * .004 + it.phase) * .16;
      it.g.rotation.y += dt * 2.6;
    }
    for (const p of trailPts) p.z += speed * dt;
    while (trailPts.length && trailPts[0].z > KILL_Z) trailPts.shift();
    rebuildTrail();

    // 地面接力（換段時重算坡面）
    for (const g of grounds) {
      g.position.z += speed * dt;
      if (g.position.z > GROUND_LEN / 2 + 20) { g.position.z -= GROUND_LEN * 2; computeGround(g); }
    }

    // 碰撞（跳起時可越過；衝刺撞碎、護盾擋一次）
    if (state === 'run') {
      const toSmash = [];
      for (const ob of obstacles) {
        const oz = ob.g.position.z, ox = ob.g.position.x;
        if (oz > -1.4 && oz < 1.4 && Math.abs(px - ox) < ob.r + .62) {
          if (ob.ramp) {
            if (grounded) { grounded = false; pvy = 8.5 + speed * .12; runJumps++; AudioSys.jump(); }
          } else if (py < 1.1 && invulnT <= 0) {
            if (boostT > 0 || dashT > 0 || starT > 0 || bulletT > 0 || lightningT > 0) toSmash.push(ob);
            else if (shieldOn) {
              shieldOn = false; shieldBubble.visible = false; invulnT = 1;
              toSmash.push(ob);
              showToast('🛡 護盾破裂！'); AudioSys.blip(240, .3, .18, 'square');
            } else { crash(); break; }
          }
        }
      }
      runSmash += toSmash.length;
      for (const ob of toSmash) {
        const k = obstacles.indexOf(ob);
        if (k >= 0) obstacles.splice(k, 1);
        world.remove(ob.g);
        burstPuffs(ob.g.position.x, ob.g.position.y + 1, ob.g.position.z, 8, 5);
      }
    }

    // 主題背景交替
    const cyc = dist % THEME_LEN, cur = themeAt(dist);
    let cityO = cur === 1 ? 1 : 0;
    if (cyc > THEME_LEN - 80) {  // 過場漸變
      const f = (cyc - (THEME_LEN - 80)) / 80;
      cityO = cur === 1 ? 1 - f : f;
    }
    setOpacity(cityBack, cityO);
    setOpacity(mountainBack, 1 - cityO);

    AudioSys.update(speed, state === 'run' ? pvx : 0);
  }

  // 無敵星星：企鵝彩虹閃爍
  if (starT > 0) {
    pengBodyMat.color.setHSL((now * .0015) % 1, .85, .55);
    starWas = true;
  } else if (starWas) { starWas = false; applySkins(); }

  // 玩家姿態（貼合坡面、上下坡俯仰）
  const gy = terrainH(dist);
  player.position.set(px, gy + py, 0);
  if (state === 'run' || state === 'menu') {
    const lean = THREE.MathUtils.clamp(pvx * .045, -.6, .6);
    player.rotation.y = -lean * .9;
    player.rotation.z = -lean * .55;
    player.rotation.x = grounded ? Math.atan(terrainSlope(dist)) : -.2;
    penguin.position.y = grounded ? 0 : .08;
  }
  shadow.position.set(px, gy + .025, 0);
  shadow.scale.setScalar(Math.max(.4, 1 - py * .18));

  // 相機（跟著坡面起伏、視線看向前方坡道；越快視野越廣）
  camera.position.set(px * .5, 5 + gy + py * .25, 16);
  camera.lookAt(px * .85, -4.2 + gy * .45 + terrainH(dist + 34) * .55, -20);
  camera.fov = 58 + THREE.MathUtils.clamp((speed - 16) * .3, 0, 10);
  camera.updateProjectionMatrix();

  // 飄雪
  {
    const arr = snowPts.geometry.attributes.position.array;
    for (let i = 0; i < arr.length; i += 3) {
      arr[i + 1] -= dt * (2 + (i % 5));
      arr[i + 2] += speed * dt * .3;
      if (arr[i + 1] < 0) { arr[i + 1] = 26; arr[i] = Math.random() * 60 - 30; arr[i + 2] = Math.random() * 80 - 60; }
    }
    snowPts.geometry.attributes.position.needsUpdate = true;
  }

  updatePuffs(dt, (state === 'run' || state === 'crash') ? speed : 0);

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

// ---------- 初始化 ----------
AudioSys.muted = !!S.muted;
$('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
applySkins();
renderMenu();
checkDaily();
if ('serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(() => {});
if (DEBUG_D || DEBUG_ITEMS || RAMP_BOOST || DEBUG_JUMP) startRun('endless', 0);  // 測試後門直接開跑

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
